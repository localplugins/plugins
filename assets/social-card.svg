<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc" width="1200" height="630">
<title id="ttl">localplugins — the easy on-ramp to Claude Code</title>
<desc id="dsc">A local community of Claude Code plugins: green-keeper, content-multiplier, money-map, and docpin.</desc>
<rect width="1200" height="630" fill="#0d1117"/>
<rect width="1200" height="6" fill="#3fb950"/>
<rect x="80" y="64" width="54" height="54" rx="13" fill="#3fb950"/>
<text x="94" y="105" font-family="ui-monospace,Menlo,monospace" font-size="34" font-weight="700" fill="#0d1117">&gt;_</text>
<text x="150" y="108" font-family="ui-monospace,Menlo,monospace" font-size="58" font-weight="700" fill="#e6edf3">localplugins</text>
<text x="82" y="162" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="27" fill="#8b949e">The easy on-ramp to Claude Code</text>

<circle cx="94" cy="234" r="9" fill="#3fb950"/>
<text x="122" y="244" font-family="ui-monospace,Menlo,monospace" font-size="30" font-weight="700" fill="#e6edf3">green-keeper</text>
<text x="122" y="276" font-family="system-ui,sans-serif" font-size="23" fill="#8b949e">keep your tests &amp; types green — no fake-green</text>

<circle cx="94" cy="326" r="9" fill="#f778ba"/>
<text x="122" y="336" font-family="ui-monospace,Menlo,monospace" font-size="30" font-weight="700" fill="#e6edf3">content-multiplier</text>
<text x="122" y="368" font-family="system-ui,sans-serif" font-size="23" fill="#8b949e">one idea → every channel &amp; language</text>

<circle cx="94" cy="418" r="9" fill="#d29922"/>
<text x="122" y="428" font-family="ui-monospace,Menlo,monospace" font-size="30" font-weight="700" fill="#e6edf3">money-map</text>
<text x="122" y="460" font-family="system-ui,sans-serif" font-size="23" fill="#8b949e">any bank/card CSV → understood, privately</text>

<rect x="80" y="500" width="820" height="66" rx="14" fill="#161b22" stroke="#30363d"/>
<text x="106" y="542" font-family="ui-monospace,Menlo,monospace" font-size="26" font-weight="500" fill="#3fb950">/plugin marketplace add localplugins/plugins</text>

<text x="82" y="602" font-family="system-ui,sans-serif" font-size="20" fill="#8b949e">Open source · MIT · a local community of Claude Code plugins</text>
</svg>
