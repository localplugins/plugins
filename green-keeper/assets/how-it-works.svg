<svg viewBox="0 0 1040 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" width="1040" height="150">
<title id="t">How Green Keeper works</title>
<desc id="d">Pipeline: red failing tests and type errors, fixer makes the smallest real change, green-guardian verifies with no fake-green, result is genuinely green.</desc>
<rect width="1040" height="150" fill="#0d1117"/>
<g font-family="system-ui,-apple-system,sans-serif" font-size="17" fill="#e6edf3" text-anchor="middle">
  <rect x="20" y="40" width="220" height="70" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="130" y="72">Red</text><text x="130" y="95" font-size="13" fill="#8b949e">failing tests · type errors</text>
  <rect x="280" y="40" width="220" height="70" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="390" y="72">Fixer</text><text x="390" y="95" font-size="13" fill="#8b949e">smallest real change</text>
  <rect x="540" y="40" width="220" height="70" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="650" y="72">Guardian verifies</text><text x="650" y="95" font-size="13" fill="#8b949e">no fake-green</text>
  <rect x="800" y="40" width="220" height="70" rx="12" fill="#161b22" stroke="#3fb950"/>
  <text x="910" y="72">Green ✓</text><text x="910" y="95" font-size="13" fill="#8b949e">re-run to prove it</text>
</g>
<g stroke="#6e7681" stroke-width="2" fill="#6e7681">
  <line x1="244" y1="75" x2="272" y2="75"/><path d="M272 70 L280 75 L272 80 Z"/>
  <line x1="504" y1="75" x2="532" y2="75"/><path d="M532 70 L540 75 L532 80 Z"/>
  <line x1="764" y1="75" x2="792" y2="75"/><path d="M792 70 L800 75 L792 80 Z"/>
</g>
</svg>
